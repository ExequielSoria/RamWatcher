services:

  php:
    build: ./
    ports:
     - "${PHP_PORT}:80"
    env_file: .env
    volumes:
     - ./:/var/www/html:rw
    networks:
      - ramwatcher-network


  app-db:
    image: mysql:5.7
    restart: always
    ports:
     - "${MYSQL_PORT}:3306"
    volumes:
     - ./db:/var/lib/mysql
     - ./mysqld.cnf:/etc/mysql/mysql.conf.d/mysqld.cnf
     - ./data:/var/lib/mysql-files
     - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql

    env_file: .env

    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DATABASE_NAME}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}

    networks:
     - ramwatcher-network



networks:
  ramwatcher-network:
    external: true
    name: ramwatcher-network